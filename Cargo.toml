[workspace]
members = [
    "crates/mr-core",
    "crates/mr-lua",
    "crates/mr-cli",
    "crates/mr-test",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/oldjobobo/moonroom"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
mlua = { version = "0.11", features = ["lua54", "vendored"] }
rustyline = "17.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

mr-core = { path = "crates/mr-core" }
mr-lua = { path = "crates/mr-lua" }
mr-test = { path = "crates/mr-test" }
